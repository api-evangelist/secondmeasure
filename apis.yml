name: Secondmeasure
description: 'Bloomberg Second Measure is an alternative-data analytics provider that
  turns billions of anonymized U.S. consumer transaction records into daily company-
  and sector-level performance signals for investors and corporate strategy teams.
  It tracks thousands of public and private companies with 8+ years of transaction
  history, offering configurable lag options (2-day, 3-day, 7-day) from card swipe.
  Following its acquisition by Bloomberg, its analytics and transaction-level data
  feeds are delivered primarily through the Bloomberg Terminal (ALTD <GO> and ECAN
  <GO>) and enterprise data feeds rather than a public self-serve developer API. It
  was surfaced as a portfolio company of Norwest Venture Partners and added to the
  API Evangelist network for enrichment; no public API surface was found on the
  provider''s site as of this pass.'
